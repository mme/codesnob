# The half of a release that acts. Fires when main's Cargo.toml changes and
# the version it declares has no tag yet - which is what a merged release PR
# looks like, and also what a hand-bumped version looks like, so both publish.
# Same shape as amon's release / publish.
#
# Recovery: a run that died before the tag existed can simply be dispatched
# again - the gate still sees an untagged version. A run that died after the
# tag existed is healed with "Re-run failed jobs" on that run. If the runner
# died between `gh release create` and recording success, heal it with
# `gh release delete vX.Y.Z --cleanup-tag` and a fresh dispatch.
#
# The tarball names and their sha256 sidecars are contracts with install.sh,
# held by tests/release.rs.

name: release / publish

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
  workflow_dispatch:

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released: ${{ steps.gate.outputs.released }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Tags are the ledger of what is already published.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Is this a release?
        id: gate
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Plain x.y.z only, checked before anything public exists: the
          # tarball name and the installer's tag check both assume it.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$VERSION is not a plain x.y.z version; nothing was published."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Cargo.toml says $VERSION and v$VERSION is already tagged - not a release."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.gate.outputs.released == 'true'
        run: cargo test --locked

      - name: Build the tarball
        if: steps.gate.outputs.released == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          cargo build --release --locked
          STAGE=$(mktemp -d)
          install -m 755 target/release/codesnob "$STAGE/codesnob"
          install -m 644 LICENSE "$STAGE/"
          tar -C "$STAGE" -czf "codesnob-v${VERSION}-x86_64-linux.tar.gz" codesnob LICENSE
          sha256sum "codesnob-v${VERSION}-x86_64-linux.tar.gz" > "codesnob-v${VERSION}-x86_64-linux.tar.gz.sha256"

      - name: Cut the release
        if: steps.gate.outputs.released == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release body is the changelog section the release PR wrote -
          # already reviewed, possibly edited, never regenerated here.
          awk "/^## v${VERSION}\$/{found=1; next} /^## /{found=0} found" CHANGELOG.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "See the commit history for what changed." > /tmp/notes.md
          fi
          # --target pins the tag to this run's own commit, the one tested and
          # packaged above, even if main moved on mid-run.
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "codesnob v$VERSION" \
            --notes-file /tmp/notes.md \
            "codesnob-v${VERSION}-x86_64-linux.tar.gz" \
            "codesnob-v${VERSION}-x86_64-linux.tar.gz.sha256"

  # The Apple Silicon tarball, attached to the release the job above created.
  # After rather than beside it: the Linux release is never blocked by a Mac
  # build, and this job needs the tag to exist to upload to. A run that dies
  # here is healed with "Re-run failed jobs"; --clobber makes it idempotent.
  publish-macos:
    needs: publish
    if: needs.publish.outputs.released == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Test
        run: cargo test --locked

      - name: Build and attach the tarball
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --release --locked
          STAGE=$(mktemp -d)
          install -m 755 target/release/codesnob "$STAGE/codesnob"
          install -m 644 LICENSE "$STAGE/"
          # shasum, not sha256sum: macOS ships the former, same format.
          tar -C "$STAGE" -czf "codesnob-v${VERSION}-aarch64-darwin.tar.gz" codesnob LICENSE
          shasum -a 256 "codesnob-v${VERSION}-aarch64-darwin.tar.gz" > "codesnob-v${VERSION}-aarch64-darwin.tar.gz.sha256"
          gh release upload "v$VERSION" --clobber \
            "codesnob-v${VERSION}-aarch64-darwin.tar.gz" \
            "codesnob-v${VERSION}-aarch64-darwin.tar.gz.sha256"
