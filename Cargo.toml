[package]
name = "codesnob"
version = "0.2.0"
edition = "2024"
description = "Fast terminal code viewer that agents can drive: files, diffs and pull requests"
license = "Apache-2.0"
repository = "https://github.com/mme/codesnob"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
gix = { version = "0.88", default-features = false, features = ["sha1", "max-performance-safe", "status", "revision", "blob-diff", "excludes"] }
imara-diff = "0.2"
# Decodes the sticker drawn on the empty screen.
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.190"
# Mermaid diagrams in marks, drawn as box-drawing text. Pinned: it builds
# on an alpha parser, and its output is part of what the tests see.
mermansi = "=0.1.6"
# The same diagrams as pictures, where the terminal shows them: Mermaid to
# SVG, SVG to pixels.
mermaid-svg = "=0.7.0"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
# FSEvents on macOS; without it notify falls back to 30-second polling there.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
nucleo-matcher = "0.3.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
# The sticker as a terminal image: Sixel, kitty or iTerm2, whichever the
# terminal answers to.
ratatui-image = { version = "11.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2"
